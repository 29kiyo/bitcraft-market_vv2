<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BitCraft Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
</head>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <!-- ナビゲーションオーバーレイ -->
  <div id="navOverlay" class="nav-overlay hidden" onclick="closeNav()"></div>
  <nav id="sideNav" class="side-nav">
    <div class="side-nav-header">
      <span class="side-nav-title">メニュー</span>
      <button class="side-nav-close" onclick="closeNav()">✕</button>
    </div>
    <ul class="side-nav-list">
      <li><button class="nav-item" id="navHome" onclick="navGoHome()">🏠 Home</button></li>
      <li><button class="nav-item" id="navBookmarks" onclick="navGoSection('bookmarks')">🔖 Bookmarks <span class="nav-badge" id="navBookmarkCount"></span></button></li>
      <li><button class="nav-item" id="navRecent" onclick="navGoSection('recentlyViewed')">🕒 Recently Viewed <span class="nav-badge" id="navRecentCount"></span></button></li>
      <li><button class="nav-item" id="navHistory" onclick="navGoSection('searchHistory')">🔍 Search History <span class="nav-badge" id="navHistoryCount"></span></button></li>
    </ul>
  </nav>

  <header>
    <div class="header-inner">
      <button class="hamburger-btn" id="hamburgerBtn" onclick="toggleNav()" aria-label="メニューを開く">
        <span></span><span></span><span></span>
      </button>
      <div class="logo" onclick="navGoHome()" style="cursor:pointer">
        <span class="logo-icon">🛒</span>
        <div>
          <h1>BitCraft<span class="accent"> Market</span></h1>
          <p class="tagline">Powered by Bitjita API</p>
        </div>
      </div>
      <button class="craft-btn" onclick="event.stopPropagation(); openCraftModal()">⚒ クラフト計算</button>
    </div>
  </header>

  <main>
    <!-- 検索セクション -->
    <section class="search-section">
      <div class="search-box">
        <div class="search-input-wrap">
          <span class="search-icon">🔍</span>
          <input
            type="text"
            id="searchInput"
            placeholder="アイテム名(日本語・英語)"
            autocomplete="off"
          >
          <button id="searchBtn">検索</button>
        </div>
        <div id="suggestions" class="suggestions hidden"></div>
        <div id="searchHistoryDropdown" class="search-history-dropdown hidden"></div>
      </div>

      <!-- フィルター -->
      <div class="filters">
  <!-- Tier -->
  <div class="filter-group">
    <label>Tier</label>
    <div class="multi-select-wrap">
      <div class="multi-select-btn" onclick="toggleDropdown('tierDropdown')">
        <span id="tierLabel">すべて</span>
        <span class="ms-arrow">▼</span>
      </div>
      <div class="multi-select-dropdown hidden" id="tierDropdown">
        <label class="ms-item ms-all"><input type="checkbox" value="all" onchange="handleMultiAll('tier', this)"> すべて解除</label>
        <label class="ms-item"><input type="checkbox" value="-1" onchange="updateMultiLabel('tier')"> Tier -1</label>
        <label class="ms-item"><input type="checkbox" value="0" onchange="updateMultiLabel('tier')"> Tier 0</label>
        <label class="ms-item"><input type="checkbox" value="1" onchange="updateMultiLabel('tier')"> Tier 1</label>
        <label class="ms-item"><input type="checkbox" value="2" onchange="updateMultiLabel('tier')"> Tier 2</label>
        <label class="ms-item"><input type="checkbox" value="3" onchange="updateMultiLabel('tier')"> Tier 3</label>
        <label class="ms-item"><input type="checkbox" value="4" onchange="updateMultiLabel('tier')"> Tier 4</label>
        <label class="ms-item"><input type="checkbox" value="5" onchange="updateMultiLabel('tier')"> Tier 5</label>
        <label class="ms-item"><input type="checkbox" value="6" onchange="updateMultiLabel('tier')"> Tier 6</label>
        <label class="ms-item"><input type="checkbox" value="7" onchange="updateMultiLabel('tier')"> Tier 7</label>
        <label class="ms-item"><input type="checkbox" value="8" onchange="updateMultiLabel('tier')"> Tier 8</label>
        <label class="ms-item"><input type="checkbox" value="9" onchange="updateMultiLabel('tier')"> Tier 9</label>
        <label class="ms-item"><input type="checkbox" value="10" onchange="updateMultiLabel('tier')"> Tier 10</label>
      </div>
    </div>
  </div>

  <!-- レア度 -->
  <div class="filter-group">
    <label>レア度</label>
    <div class="mult
